# Copy this file to config.yaml and fill in your own values.
# config.yaml is gitignored — never commit real credentials.

mt5:
  # Leave path/login/password/server blank to attach to an already-logged-in
  # terminal (the bridge just needs MT5 running with a chart open).
  # Fill them in if you want this script to log in itself.
  terminal_path: ""      # e.g. "C:/Program Files/MetaTrader 5/terminal64.exe"
  login: 0
  password: ""
  server: ""

anthropic:
  api_key_env: "ANTHROPIC_API_KEY"   # name of the env var holding the key
  model: "claude-sonnet-4-6"

trading:
  symbols: ["EURUSD"]
  timeframe: "M15"        # M1, M5, M15, M30, H1, H4, D1
  bars: 200               # how many recent candles to feed the model
  poll_seconds: 60        # how often to check for a new closed candle
  magic_number: 990177

  htf_timeframe: "H4"       # higher timeframe used for ICT directional bias

  # Deterministic ICT/SMC structure detection, computed by code and fed to the
  # AI as features so it doesn't have to re-derive structure from raw candles.
  # A SUITE of strategies is evaluated every candle (both directions):
  # liquidity_sweep_mss, order_block, fair_value_gap, breaker_block,
  # turtle_soup, optimal_trade_entry. Each detected setup is tagged with its
  # strategy name; the AI reports which one it acted on, and report.py breaks
  # results down "BY ICT STRATEGY". The AI is NOT forced to take any of them —
  # they're several sets of eyes alongside its own read.
  ict:
    enabled: true
    htf_bars: 300             # bars pulled on htf_timeframe for the bias check
    swing_left_right: 3       # bars each side required to confirm a swing point
    min_fvg_points: 30        # minimum fair-value-gap size (broker points) to be tradable
    sweep_buffer_points: 20   # stop buffer + zone tolerance (broker points) for all strategies
    entry_at_midpoint: true   # liquidity_sweep_mss entry at 50% of the FVG (false = far edge)
    require_htf_bias: true    # only surface setups aligned with HTF structure

  # Normal analysis only happens once per closed candle (every poll_seconds
  # check), which can miss a fast intra-candle move (e.g. a news-driven
  # sweep-and-reverse that fully plays out before the candle closes). This
  # samples price every volatility_check_seconds and fires an immediate,
  # out-of-cycle AI call if price moves more than volatility_points within
  # volatility_window_seconds — independent of the candle clock.
  volatility_trigger:
    enabled: true
    check_seconds: 5          # how often to sample price for the spike check
    window_seconds: 60        # look-back window for the move
    points: 150               # min move (in broker points) within the window to count as a spike
    cooldown_seconds: 120     # minimum time between two spike-triggered calls for the same symbol

risk:
  # SAFETY: dry_run must be explicitly set to false to ever send a real order.
  dry_run: true
  max_risk_percent_per_trade: 1.0
  max_open_positions: 3
  max_daily_trades: 6
  max_spread_points: 30
  min_confidence: 0.65     # ignore AI signals below this confidence
  fallback_rr: 2.0         # used if the AI doesn't supply a take-profit

logging:
  log_dir: "logs"
  log_ai_responses: true
